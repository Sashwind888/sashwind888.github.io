<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 背景流光渐变（蔚蓝 #4aa3f5 与科技青 #38bdf8） -->
    <linearGradient id="blogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aa3f5" />
      <stop offset="100%" stop-color="#1d7ed6" />
    </linearGradient>

    <!-- 磨砂玻璃质感内阴影 -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 字母 S 微光高亮 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- 外层 Material You 扁平圆角卡片底盘 -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#blogBgGrad)" filter="url(#subtleGlow)" />

  <!-- 顶部微光磨砂反光层 -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#glassGloss)" />

  <!-- 外边框描边 -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- 艺术笔触风的 S 字母 / 现代书页羽毛几何形态 -->
  <path
    d="M39.5 21.5 C38.5 17.5 34.5 15.5 29.5 15.5 C23 15.5 18 19 18 25 C18 34.5 35 31.5 35 39 C35 43.5 31 46.5 25.5 46.5 C20 46.5 16 43 14.5 38"
    fill="none"
    stroke="url(#textGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 灵动笔尖装饰点（代表博客创作与灵感） -->
  <circle cx="44.5" cy="43.5" r="3.2" fill="#ffffff" />
</svg>
