<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/blog-frontend/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sashwind's Blog</title>
    <script>
      // 首帧前应用主题，避免闪烁
      (function () {
        try {
          var saved = localStorage.getItem('blog.theme') || 'system'
          var dark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <script type="module" crossorigin src="/blog-frontend/assets/index-BC6Oa6AI.js"></script>
    <link rel="stylesheet" crossorigin href="/blog-frontend/assets/index-VrzF2lk9.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
